<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YEEE | VISUAL ARTIST</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet">

    <link rel="preload" as="image" href="Background/IMG_3832.jpeg" fetchpriority="high">

    <style>
        /* --- V7.0 風格定義 --- */
        :root {
            --bg-color: #0c0c0c;
            --text-white: #ffffff;
            --text-grey: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-color);
        }

        body {
            font-family: 'Roboto', 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-white);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        .filter-btn,
        .footer-logo {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        /* 導覽列 */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(12, 12, 12, 0.95), rgba(12, 12, 12, 0));
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
        }

        .menu {
            display: flex;
            align-items: center;
        }

        .menu a {
            color: #fff;
            text-decoration: none;
            margin-left: 30px;
            font-size: 14px;
            letter-spacing: 1px;
            font-family: 'Oswald', sans-serif;
            opacity: 0.7;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        .menu a:hover {
            opacity: 1;
        }

        .lang-toggle-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 3px;
            color: #fff;
            margin-left: 30px;
            padding: 4px 10px;
            font-size: 13px;
            letter-spacing: 1px;
            font-family: 'Oswald', sans-serif;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .lang-toggle-btn:hover {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.08);
        }

        .lang-toggle-btn .lang-opt {
            opacity: 0.45;
            transition: opacity 0.25s;
        }

        .lang-toggle-btn .lang-opt.active {
            opacity: 1;
            font-weight: 700;
        }

        /* --- Hero 區域 --- */
        .hero {
            height: 75vh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: var(--bg-color);
        }

        .hero-bg-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .hero-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            display: block;
        }

        .hero-slide.active {
            opacity: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3), var(--bg-color));
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding: 0 50px;
        }

        .hero-title {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 700;
            line-height: 0.9;
            margin: 0;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.9);
            transition: 0.5s;
            cursor: default;
        }

        .hero-title:hover {
            color: #fff;
            -webkit-text-stroke: 0;
        }

        .hero-subtitle {
            margin-top: 20px;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 4px;
            max-width: 700px;
        }

        /* --- 篩選列 --- */
        .filter-section {
            padding: 40px 50px 20px 50px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
            background-color: var(--bg-color);
        }

        .filter-btn {
            background: none;
            border: none;
            color: var(--text-grey);
            font-size: 15px;
            cursor: pointer;
            letter-spacing: 1px;
            padding: 0;
            transition: color 0.3s;
            position: relative;
        }

        .filter-btn.about-btn {
            color: #fff;
            font-weight: 500;
        }

        .separator {
            color: #444;
            font-size: 14px;
            margin: 0 5px;
            font-family: 'Oswald', sans-serif;
        }

        .filter-btn.active,
        .filter-btn:hover {
            color: var(--text-white);
        }

        .filter-btn.active {
            font-weight: bold;
            border-bottom: 1px solid #fff;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2px;
            padding: 0 50px 100px 50px;
            min-height: 50vh;
            background-color: var(--bg-color);
        }

        .project-card {
            position: relative;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
            cursor: pointer;
        }

        .media-layer {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .media-layer img,
        .media-layer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            transition: opacity 0.3s;
            display: block;
        }

        /* 標題覆蓋層 */
        .info-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 30px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s ease;
        }

        /* 電腦版 Hover 效果 */
        @media (min-width: 769px) {
            .project-card:hover .media-layer {
                transform: scale(1.05);
            }

            /* Hover 時影片變亮 */
            .project-card:hover .media-layer img,
            .project-card:hover .media-layer video {
                opacity: 1;
            }

            .project-card:hover .info-overlay {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-type {
            font-size: 12px;
            color: var(--text-grey);
            letter-spacing: 2px;
            margin-bottom: 5px;
            display: block;
        }

        .card-title {
            font-size: 24px;
            font-weight: 500;
            margin: 0;
            letter-spacing: 1px;
            font-family: 'Oswald', sans-serif;
        }

        /* Footer */
        footer {
            background-color: var(--bg-color);
            padding: 80px 50px 40px 50px;
            margin-top: auto;
            position: relative;
            border: none;
        }

        .footer-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 40px;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
        }

        .footer-logo {
            font-size: 1.8rem;
            line-height: 1.1;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #fff;
        }

        .footer-zh {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #ccc;
            margin-bottom: 40px;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .copyright {
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 0.5px;
        }

        .footer-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-link {
            width: 40px;
            height: 40px;
            background-color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
            text-decoration: none;
        }

        .social-link:hover {
            transform: translateY(-3px);
        }

        .social-link svg {
            width: 18px;
            height: 18px;
            fill: #000;
        }

        .contact-label {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .contact-info {
            font-size: 0.9rem;
            color: #999;
            letter-spacing: 1px;
            line-height: 1.6;
            text-decoration: none;
            display: block;
        }

        .contact-info:hover {
            color: #fff;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
            overflow-y: auto;
        }

        .modal-container {
            width: 100%;
            max-width: 900px;
            margin: 80px auto;
            padding: 0 20px;
            color: #fff;
            position: relative;
        }

        .modal-container.project-modal-mode {
            max-width: 100%;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ArtStation 橫式雙欄版面 */
        .artstation-layout {
            display: flex;
            align-items: flex-start;
            min-height: 100vh;
            width: 100%;
        }

        .modal-stage {
            flex: 1;
            min-width: 0;
            min-height: 100vh;
            background: #070707;
            padding: 40px 80px 80px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .modal-stage .modal-gallery {
            width: 100%;
            max-width: 1150px;
        }

        .modal-sidebar {
            width: 400px;
            flex-shrink: 0;
            background: #141414;
            border-left: 1px solid #262626;
            padding: 65px 32px 40px 32px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .modal-sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .modal-sidebar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        /* 這裡一定要有 white-space: pre-line; */
        .modal-content-body {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 35px;
            max-width: 800px;
            white-space: pre-line;
        }

        /* --- 🌟 新增：內文小標題樣式 --- */
        .modal-content-subtitle {
            font-size: 1.25rem;
            color: #fff;
            font-weight: 500;
            margin-top: 28px;
            margin-bottom: 6px;
            padding-left: 12px;
            border-left: 3px solid var(--accent);
            letter-spacing: 1px;
            font-family: 'Noto Sans TC', sans-serif;
            line-height: 1.4;
        }

        .close-btn {
            position: fixed;
            top: 18px;
            right: 24px;
            font-size: 36px;
            line-height: 1;
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            z-index: 1003;
            transition: color 0.2s, transform 0.2s;
        }

        .close-btn:hover {
            color: #fff;
            transform: scale(1.1);
        }

        /* 左右切換作品按鈕 */
        .modal-nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 64px;
            background: rgba(20, 20, 20, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1002;
            transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.25s;
            padding: 0;
        }

        .modal-nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.5);
        }

        .modal-nav-btn svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .modal-nav-btn.prev-btn {
            left: 16px;
        }

        .modal-nav-btn.next-btn {
            right: 416px;
        }

        .modal-header-large {
            font-size: 2.2rem;
            line-height: 1.2;
            font-family: 'Oswald', sans-serif;
            margin-bottom: 16px;
            border-bottom: 1px solid #2e2e2e;
            padding-bottom: 16px;
            word-break: break-word;
        }

        .modal-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: var(--text-grey);
            font-size: 0.88rem;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .modal-gallery img,
        .modal-gallery video {
            width: 100%;
            margin-bottom: 24px;
            display: block;
            border-radius: 4px;
        }

        .yt-btn {
            display: inline-block;
            border: 1px solid #fff;
            color: #fff;
            padding: 14px 30px;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 2px;
            transition: 0.3s;
            margin-top: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            cursor: pointer;
        }

        .yt-btn:hover {
            background: #fff;
            color: #000;
        }

        .about-modal-layout {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .about-modal-img {
            flex: 1;
            min-width: 300px;
        }

        .about-modal-img img {
            width: 100%;
            filter: grayscale(100%);
        }

        .about-modal-text {
            flex: 2;
        }

        /* --- 📱 響應式與手機版專屬優化 --- */
        @media (max-width: 1024px) {
            .modal-overlay {
                -webkit-overflow-scrolling: touch;
            }

            .artstation-layout {
                display: block;
                min-height: 0;
                height: auto;
            }

            .modal-stage {
                display: block;
                flex: none;
                width: 100%;
                height: auto;
                min-height: 0;
                padding: 64px 16px 24px 16px;
                overflow: visible;
            }

            .modal-stage .modal-gallery {
                width: 100%;
                height: auto;
                overflow: visible;
            }

            .modal-sidebar {
                display: block;
                flex: none;
                width: 100%;
                height: auto;
                max-height: none;
                position: static;
                overflow: visible;
                border-left: none;
                border-top: 1px solid #262626;
                padding: 32px 20px 60px 20px;
            }

            .modal-nav-btn.prev-btn {
                left: 10px;
                width: 38px;
                height: 52px;
            }

            .modal-nav-btn.next-btn {
                right: 10px;
                width: 38px;
                height: 52px;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 15px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .menu a {
                margin-left: 15px;
                font-size: 12px;
            }

            .lang-toggle-btn {
                margin-left: 15px;
                font-size: 11px;
                padding: 3px 8px;
            }

            .hero-title {
                font-size: 4rem;
            }

            .hero-content {
                padding: 0 20px;
            }

            .filter-section {
                padding: 30px 20px;
                gap: 15px;
            }

            .filter-btn {
                font-size: 13px;
                padding: 5px 0;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
                padding: 0 20px 50px 20px;
            }

            .info-overlay {
                opacity: 1;
                transform: translateY(0);
                background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
                padding: 20px;
            }

            .media-layer img,
            .media-layer video {
                opacity: 0.85;
            }

            .footer-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 40px;
            }

            .footer-right {
                align-items: flex-start;
                text-align: left;
            }

            footer {
                padding: 50px 20px;
            }

            .modal-container {
                margin: 60px auto;
            }

            .modal-container.project-modal-mode {
                margin: 0;
            }

            .modal-header-large {
                font-size: 1.8rem;
            }

            .about-modal-layout {
                flex-direction: column;
                gap: 20px;
            }

            .about-modal-img {
                min-width: 100%;
            }
        }

        /* --- 圖片預先下載與 Loading 視覺特效 --- */
        .img-loading-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #1c1c1c;
            /* 作為暫時的 Placeholder 底色 */
            overflow: hidden;
        }

        /* [關鍵修復] 確保 Loading 容器在 Hero Slider 中保持原本的絕對定位，不被 relative 覆蓋 */
        .hero-slide.img-loading-container {
            position: absolute;
        }

        /* 圖片未載入前的模糊與隱藏狀態 */
        .img-loading-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            /* 隱藏逐步下載過程 */
            filter: blur(20px);
            transform: scale(1.1);
            transition: opacity 0.8s ease-out, filter 0.8s ease-out, transform 0.8s ease-out;
            display: block;
        }

        /* 圖片 100% 載入完成後的清晰狀態 */
        .img-loading-container.loaded img {
            opacity: 1;
            filter: blur(0);
            transform: scale(1);
        }

        /* 半透明毛玻璃 (Frosted Glass) Loading 遮罩 */
        .blur-placeholder.frosted-glass {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.08);
            /* 避免純黑色，帶點微光 */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 2;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
        }

        /* 圖片載入完成，毛玻璃淡出消失 */
        .img-loading-container.loaded .blur-placeholder.frosted-glass {
            opacity: 0;
            visibility: hidden;
        }

        /* --- 針對原本各區塊的樣式兼容與覆蓋 --- */
        /* Gallery Hover 特殊處理 (延續原本的 0.7 透明度設定) */
        .project-card .img-loading-container.loaded img {
            opacity: 0.7;
        }

        @media (min-width: 769px) {
            .project-card:hover .img-loading-container.loaded img {
                opacity: 1 !important;
            }
        }

        /* Modal 彈窗內的圖片間距與自適應高度處理 */
        .modal-img-wrapper.img-loading-container {
            height: auto;
            min-height: 80px;
            margin-bottom: 24px;
            border-radius: 4px;
        }

        .modal-img-wrapper.img-loading-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            margin-bottom: 0 !important;
        }

        /* About 彈窗內的灰階濾鏡兼容 */
        .about-modal-img .img-loading-container.loaded img {
            filter: grayscale(100%) blur(0);
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">YEEE.</div>
        <div class="menu">
            <a href="#works">PROJECTS</a>
            <a onclick="openAboutModal()">ABOUT ME</a>
            <button class="lang-toggle-btn" id="langToggleBtn" onclick="toggleLanguage()"
                title="切換中英文 / Switch Language">
                <span class="lang-opt active" data-lang="zh">ZH</span>
                <span>/</span>
                <span class="lang-opt" data-lang="en">EN</span>
            </button>
        </div>
    </nav>

    <div class="hero">
        <div class="hero-bg-slider" id="heroBgSlider"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title">VISUAL NARRATIVE<br>& DESIGN</h1>
            <div class="hero-subtitle">
                STORYBOARD / CHARACTER / 3D ART / ILLUSTRATION
            </div>
        </div>
    </div>

    <div class="filter-section" id="works">
        <button class="filter-btn about-btn" onclick="openAboutModal()">ABOUT</button>
        <span class="separator">/</span>
        <button class="filter-btn active" onclick="filterProjects('all')">ALL</button>
        <button class="filter-btn" onclick="filterProjects('work')">WORK</button>
        <button class="filter-btn" onclick="filterProjects('3d')">3D ART</button>
        <button class="filter-btn" onclick="filterProjects('storyboard')">STORYBOARD</button>
        <button class="filter-btn" onclick="filterProjects('character')">CHARACTER</button>
        <button class="filter-btn" onclick="filterProjects('scene')">SCENE</button>
        <button class="filter-btn" onclick="filterProjects('illustration')">ILLUSTRATION</button>
    </div>

    <main class="gallery-grid" id="galleryContainer"></main>

    <footer>
        <div class="footer-container">
            <div class="footer-left">
                <div class="footer-logo">YEEE.</div>
                <div class="footer-zh" id="footerZh">田繁易個人作品集</div>
                <div class="copyright">© 2023-2025 YEEE All Rights Reserved</div>
            </div>
            <div class="footer-right">
                <div class="social-icons">
                    <a href="https://www.facebook.com/ye.yi.yi.233045" target="_blank" class="social-link"

        /* --- 3. Core Logic --- */
        const container = document.getElementById('galleryContainer');
        const modal = document.getElementById('projectModal');
        const modalContainer = document.getElementById('modalContainer');
        const modalBody = document.getElementById('modalBody');
        const modalPrevBtn = document.getElementById('modalPrevBtn');
        const modalNextBtn = document.getElementById('modalNextBtn');

        let currentFilteredProjects = [];
        let currentProjectIndex = -1;

        function getProjectTitle(project) {
            return (currentLang === 'en' && project.titleEn) ? project.titleEn : project.title;
        }

        function getProjectDescription(project) {
            return (currentLang === 'en' && project.descriptionEn) ? project.descriptionEn : (project.description || '');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.documentElement.lang = currentLang === 'zh' ? 'zh-TW' : 'en';

            // 更新頂部按鈕狀態
            document.querySelectorAll('#langToggleBtn .lang-opt').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-lang') === currentLang);
            });

            // 更新頁尾副標題
            const footerZhEl = document.getElementById('footerZh');
            if (footerZhEl) {
                footerZhEl.textContent = uiTranslations[currentLang].footerSubtitle;
            }

            // 重新渲染作品列表
            renderProjects(currentFilterType);

            // 若彈窗開啟中，同步更新彈窗語言
            if (modal.style.display === 'block') {
                if (isAboutModalOpen) {
                    openAboutModal();
                } else if (currentProjectIndex !== -1 && currentFilteredProjects[currentProjectIndex]) {
                    openModal(currentFilteredProjects[currentProjectIndex], currentProjectIndex);
                }
            }
        }

        function getPriorityIndex(types, orderList) {
            const typeArr = Array.isArray(types) ? types : [types];
            let minIndex = 999;
            typeArr.forEach(t => {
                const idx = orderList.indexOf(t);
                if (idx !== -1 && idx < minIndex) minIndex = idx;
            });
            return minIndex;
        }

        function renderProjects(filterType) {
            currentFilterType = filterType;
            container.innerHTML = '';

            // 僅顯示 visible !== false 的作品
            const visibleProjects = projects.filter(p => p.visible !== false);

            const filteredData = filterType === 'all'
                ? visibleProjects
                : visibleProjects.filter(p => {
                    if (Array.isArray(p.type)) { return p.type.includes(filterType); }
                    return p.type === filterType;
                });

            filteredData.sort((a, b) => {
                const indexA = getPriorityIndex(a.type, categorySortOrder);
                const indexB = getPriorityIndex(b.type, categorySortOrder);
                if (indexA !== indexB) {
                    return indexA - indexB;
                }
                return (a.order || 999) - (b.order || 999);
            });

            currentFilteredProjects = filteredData;

            filteredData.forEach((project, index) => {
                const card = document.createElement('div'); card.className = 'project-card';
                card.onclick = () => openModal(project, index);

                const displayTitle = getProjectTitle(project);

                // 判斷圖片優先順序
                let preloadAttrs = '';
                if (index < 4) {
                    // 【第二優先級】首屏可見範圍 (前 4 張專案)：優先下載
                    preloadAttrs = 'fetchpriority="high" loading="eager"';
                } else {
                    // 【第三優先級】非首屏需滾動內容：延遲下載
                    preloadAttrs = 'fetchpriority="low" loading="lazy"';
                }

                let mediaContent = '';
                if (project.videoFile) {
                    const posterAttr = project.poster ? `poster="${project.poster}"` : '';

                    if (project.videoFile.toLowerCase().includes('loop')) {
                        mediaContent = `<video src="${project.videoFile}" ${posterAttr} autoplay muted loop playsinline preload="metadata"></video>`;
                    }
                    else {
                        mediaContent = `<video src="${project.videoFile}" ${posterAttr} muted loop playsinline preload="none"></video>`;
                    }
                } else if (project.imageFile) {
                    // 套用毛玻璃 Loading 結構與優先順序
                    mediaContent = `
                    <div class="img-loading-container" style="height: 100%;">
                        <div class="blur-placeholder frosted-glass"></div>
                        <img src="${project.imageFile}" alt="${displayTitle}" ${preloadAttrs} onload="this.closest('.img-loading-container').classList.add('loaded')">
                    </div>
                `;
                }

                let typeLabel = '';
                if (Array.isArray(project.type)) { typeLabel = project.type.join(' / ').toUpperCase(); }
                else { typeLabel = project.type.toUpperCase(); }

                card.innerHTML = `
                <div class="media-layer">${mediaContent}</div>
                <div class="info-overlay">
                    <span class="card-type">${typeLabel}</span>
                    <h3 class="card-title">${displayTitle}</h3>
                </div>
            `;

                const video = card.querySelector('video');
                if (video && !video.hasAttribute('autoplay')) {
                    card.addEventListener('mouseenter', () => {
                        video.muted = false;
                        if (video.preload === 'none') { video.preload = 'auto'; }
                        var p = video.play();
                        if (p !== undefined) { p.catch(e => { video.muted = true; video.play(); }); }
                    });
                    card.addEventListener('mouseleave', () => {
                        video.pause(); video.load();
                    });
                }

                container.appendChild(card);
            });
        }

        function openModal(project, index) {
            isAboutModalOpen = false;
            // 停止先前彈窗內播放中的影片
            const oldVideos = modalBody.querySelectorAll('video');
            oldVideos.forEach(v => v.pause());

            if (typeof index === 'number') {
                currentProjectIndex = index;
            } else {
                currentProjectIndex = currentFilteredProjects.indexOf(project);
            }

            modalContainer.classList.add('project-modal-mode');
            if (currentFilteredProjects.length > 1) {
                modalPrevBtn.style.display = 'flex';
                modalNextBtn.style.display = 'flex';
            } else {
                modalPrevBtn.style.display = 'none';
                modalNextBtn.style.display = 'none';
            }

            const contentHtml = project.images.map((file, idx) => {
                if (file.toLowerCase().endsWith('.mp4')) {
                    if (file.toLowerCase().includes('loop')) {
                        return `<video src="${file}" autoplay muted loop playsinline></video>`;
                    } else {
                        return `<video src="${file}" controls playsinline loop preload="metadata"></video>`;
                    }
                } else {
                    // 彈窗內圖片全部設為 eager 載入，避免在固定滾動容器中因 lazy 導致後續圖片不顯示
                    const preloadAttrs = idx === 0 ? 'fetchpriority="high" loading="eager"' : 'fetchpriority="low" loading="eager"';
                    return `
                    <div class="img-loading-container modal-img-wrapper">
                        <div class="blur-placeholder frosted-glass"></div>
                        <img src="${file}" ${preloadAttrs} onload="this.closest('.img-loading-container').classList.add('loaded')">
                    </div>
                `;
                }
            }).join('');

            const t = uiTranslations[currentLang];
            let buttonHtml = '';
            if (project.youtubeLink && project.youtubeLink !== "" && project.youtubeLink !== "#") {
                buttonHtml = `<a href="${project.youtubeLink}" target="_blank" class="yt-btn">${t.watchVideoBtn}</a>`;
            }

            let typeLabel = '';
            if (Array.isArray(project.type)) { typeLabel = project.type.join(' / ').toUpperCase(); }
            else { typeLabel = project.type.toUpperCase(); }

            const displayTitle = getProjectTitle(project);
            let processedDescription = getProjectDescription(project);
            processedDescription = processedDescription.replace(/^##\s+(.+)$/gm, '<div class="modal-content-subtitle">$1</div>');

            modalBody.innerHTML = `
            <div class="artstation-layout">
                <div class="modal-stage">
                    <div class="modal-gallery">${contentHtml}</div>
                </div>
                <aside class="modal-sidebar">
                    <div class="modal-header-large">${displayTitle}</div>
                    <div class="modal-meta">
                        <span>${t.categoryLabel}: ${typeLabel}</span>
                        <span>${t.toolsLabel}: ${project.software || 'N/A'}</span>
                    </div>
                    <div class="modal-content-body">${processedDescription}</div>
                    ${buttonHtml}
                </aside>
            </div>
        `;

            modal.scrollTop = 0;
            modal.style.display = 'block';
            setTimeout(() => { modal.style.opacity = '1'; }, 10);
            document.body.style.overflow = 'hidden';
        }

        function navigateProject(direction) {
            if (currentProjectIndex === -1 || currentFilteredProjects.length <= 1) return;
            const nextIndex = (currentProjectIndex + direction + currentFilteredProjects.length) % currentFilteredProjects.length;
            openModal(currentFilteredProjects[nextIndex], nextIndex);
        }

        document.addEventListener('keydown', (e) => {
            if (modal.style.display !== 'block') return;
            if (e.key === 'Escape') {
                closeModal();
            } else if (e.key === 'ArrowLeft' && currentProjectIndex !== -1) {
                e.preventDefault();
                navigateProject(-1);
            } else if (e.key === 'ArrowRight' && currentProjectIndex !== -1) {
                e.preventDefault();
                navigateProject(1);
            }
        });

        function openAboutModal() {
            isAboutModalOpen = true;
            currentProjectIndex = -1;
            modalContainer.classList.remove('project-modal-mode');
            modalPrevBtn.style.display = 'none';
            modalNextBtn.style.display = 'none';

            const t = uiTranslations[currentLang];

            modalBody.innerHTML = `
            <div class="modal-header-large">${t.aboutHeader}</div>

                        <div class="blur-placeholder frosted-glass" style="border-radius: 4px;"></div>
                        <img src="FACE/IMG_2732.jpeg" style="border-radius: 4px; width: 100%;" fetchpriority="high" loading="eager" onload="this.closest('.img-loading-container').classList.add('loaded')">
                    </div>
                </div>
                <div class="about-modal-text">
                    <h3 style="margin-top:0; color:#fff;">${t.aboutGreeting}</h3>
                    <p class="modal-content-body" style="margin-top:20px;">${t.aboutBio}</p>
                    <p style="color:#666; margin-top:30px;">${t.aboutSkillsLabel}<br>MAYA,ZBrush,Blender,Unreal Photoshop,Adobe Premiere Pro, After Effects</p>
                    <button onclick="document.getElementById('contact-icons-row').style.display = 'flex'; this.style.display = 'none';" class="yt-btn" style="margin-top:30px; background: transparent; width: auto; cursor: pointer;">${t.contactMeBtn}</button>
                    <div id="contact-icons-row" style="display: none; gap: 20px; margin-top: 30px; justify-content: flex-start;">

                        <a href="https://www.instagram.com/yeee.0413?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="social-link" style="width:50px; height:50px;" title="Instagram"><svg viewBox="0 0 24 24" style="width:24px;height:24px;"><path d="M7.8,2H16.2C19.4,2 22,4.6 22,7.8V16.2A5.8,5.8 0 0,1 16.2,22H7.8C4.6,22 2,19.4 2,16.2V7.8A5.8,5.8 0 0,1 7.8,2M7.6,4A3.6,3.6 0 0,0 4,7.6V16.4C4,18.39 5.61,20 7.6,20H16.4A3.6,3.6 0 0,0 20,16.4V7.6C20,5.61 18.39,4 16.4,4H7.6M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M19,5A1,1 0 0,1 20,6A1,1 0 0,1 19,7A1,1 0 0,1 18,6A1,1 0 0,1 19,5Z" /></svg></a>
                        <a href="https://youtube.com/@yeee-h3d?si=HJiVyQ6-vUbY-lUe" target="_blank" class="social-link" style="width:50px; height:50px;" title="YouTube"><svg viewBox="0 0 24 24" style="width:24px;height:24px;"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg></a>
                        <a href="https://www.artstation.com/yeee-20260203" target="_blank" class="social-link" style="width:50px; height:50px;" title="ArtStation"><svg viewBox="0 0 24 24" style="width:24px;height:24px;"><path d="M0 17.723l2.027 3.505h.001a2.424 2.424 0 0 0 2.164 1.333h13.457l-2.792-4.838H0zm24 .025c0-.484-.143-.935-.388-1.314L15.728 2.728a2.424 2.424 0 0 0-2.142-1.289H9.419L21.598 22.54l1.92-3.325c.378-.637.482-.919.482-1.467zm-11.129-3.462L7.428 4.858l-5.444 9.428h10.887z"/></svg></a>
                    </div>
                </div>
            </div>
        `;
            modal.scrollTop = 0;
            modal.style.display = 'block';
            setTimeout(() => { modal.style.opacity = '1'; }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            // ★ V7.7: Force Pause
            const videos = modalBody.querySelectorAll('video');
            videos.forEach(v => v.pause());

            isAboutModalOpen = false;
            currentProjectIndex = -1;
            modalPrevBtn.style.display = 'none';
            modalNextBtn.style.display = 'none';

            modal.style.opacity = '0';
            setTimeout(() => {
                modal.style.display = 'none';
                modalContainer.classList.remove('project-modal-mode');
                document.body.style.overflow = 'auto';
                modalBody.innerHTML = '';
            }, 300);
        }

        function filterProjects(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event.target.classList.contains('filter-btn') && !event.target.classList.contains('about-btn')) { event.target.classList.add('active'); }
            renderProjects(type);
        }
        renderProjects('all');
    </script>

</body>
