    <style>
        /* --- V7.0 風格定義 --- */
        :root {
            --bg-color: #0c0c0c; 
            --text-white: #ffffff;
            --text-grey: #888888;
            --accent: #ffffff;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; background-color: var(--bg-color); }

        body {
            font-family: 'Roboto', 'Noto Sans TC', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-white);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, .filter-btn, .footer-logo {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        /* 導覽列 */
        nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; z-index: 100;
            background: linear-gradient(to bottom, rgba(12,12,12,0.95), rgba(12,12,12,0));
        }

        .logo { font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #fff; }
        .menu a { color: #fff; text-decoration: none; margin-left: 30px; font-size: 14px; letter-spacing: 1px; font-family: 'Oswald', sans-serif; opacity: 0.7; transition: opacity 0.3s; cursor: pointer; }
        .menu a:hover { opacity: 1; }

        /* --- Hero 區域 --- */
        .hero {
            height: 75vh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: var(--bg-color);
        }

        .hero-bg-slider { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        
        .hero-slide { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; 
            opacity: 0; transition: opacity 2s ease-in-out; 
            display: block; 
        }
        .hero-slide.active { opacity: 1; }

        .hero-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), var(--bg-color)); 
            z-index: 1; 
        }

        .hero-content { position: relative; z-index: 2; padding: 0 50px; }
        
        .hero-title {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 700; line-height: 0.9; margin: 0;
            color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.9);
            transition: 0.5s; cursor: default;
        }
        .hero-title:hover { color: #fff; -webkit-text-stroke: 0; }
        .hero-subtitle { margin-top: 20px; font-size: 1rem; color: rgba(255,255,255,0.8); letter-spacing: 4px; max-width: 700px; }

        /* --- 篩選列 --- */
        .filter-section {
            padding: 40px 50px 20px 50px; 
            display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
            margin-bottom: 20px;
            background-color: var(--bg-color);
        }

        .filter-btn { background: none; border: none; color: var(--text-grey); font-size: 15px; cursor: pointer; letter-spacing: 1px; padding: 0; transition: color 0.3s; position: relative; }
        .filter-btn.about-btn { color: #fff; font-weight: 500; }
        .separator { color: #444; font-size: 14px; margin: 0 5px; font-family: 'Oswald', sans-serif; }
        .filter-btn.active, .filter-btn:hover { color: var(--text-white); }
        .filter-btn.active { font-weight: bold; border-bottom: 1px solid #fff; }

        /* Gallery Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 2px; padding: 0 50px 100px 50px; min-height: 50vh; background-color: var(--bg-color); }
        .project-card { position: relative; aspect-ratio: 16/9; background: #000; overflow: hidden; cursor: pointer; }
        
        .media-layer { width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .media-layer img, .media-layer video { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: opacity 0.3s; display: block; }
        
        /* 標題覆蓋層 */
        .info-overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px; 
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); 
            transform: translateY(20px); opacity: 0; transition: all 0.4s ease; 
        }
        
        /* 電腦版 Hover 效果 */
        @media (min-width: 769px) {
            .project-card:hover .media-layer { transform: scale(1.05); }
            /* Hover 時影片變亮 */
            .project-card:hover .media-layer img, .project-card:hover .media-layer video { opacity: 1; }
            .project-card:hover .info-overlay { opacity: 1; transform: translateY(0); }
        }

        .card-type { font-size: 12px; color: var(--text-grey); letter-spacing: 2px; margin-bottom: 5px; display: block; }
        .card-title { font-size: 24px; font-weight: 500; margin: 0; letter-spacing: 1px; font-family: 'Oswald', sans-serif; }

        /* Footer */
        footer { background-color: var(--bg-color); padding: 80px 50px 40px 50px; margin-top: auto; position: relative; border: none; }
        .footer-container { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 40px; }
        .footer-left { display: flex; flex-direction: column; }
        .footer-logo { font-size: 1.8rem; line-height: 1.1; letter-spacing: 1px; margin-bottom: 5px; color: #fff; }
        .footer-zh { font-size: 0.9rem; letter-spacing: 2px; color: #ccc; margin-bottom: 40px; font-family: 'Noto Sans TC', sans-serif; }
        .copyright { font-size: 0.75rem; color: #555; letter-spacing: 0.5px; }
        .footer-right { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
        .social-icons { display: flex; gap: 15px; margin-bottom: 25px; }
        .social-link { width: 40px; height: 40px; background-color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.3s; text-decoration: none; }
        .social-link:hover { transform: translateY(-3px); }
        .social-link svg { width: 18px; height: 18px; fill: #000; }
        .contact-label { font-size: 0.8rem; color: #666; margin-bottom: 5px; letter-spacing: 1px; }
        .contact-info { font-size: 0.9rem; color: #999; letter-spacing: 1px; line-height: 1.6; text-decoration: none; display: block; }
        .contact-info:hover { color: #fff; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: none; opacity: 0; transition: opacity 0.3s; overflow-y: auto; }
        .modal-container { width: 100%; max-width: 900px; margin: 80px auto; padding: 0 20px; color: #fff; position: relative; }
        /* 這裡一定要有 white-space: pre-line; */
        .modal-content-body { font-size: 1.1rem; line-height: 1.8; color: #ccc; margin-bottom: 50px; max-width: 800px; white-space: pre-line; }
        
        /* --- 🌟 新增：內文小標題樣式 --- */
        .modal-content-subtitle { 
            font-size: 1.35rem; 
            color: #fff; 
            font-weight: 500; 
            margin-top: 35px; 
            margin-bottom: 5px; 
            padding-left: 12px; 
            border-left: 3px solid var(--accent); 
            letter-spacing: 1px; 
            font-family: 'Noto Sans TC', sans-serif;
            line-height: 1.4;
        }

        .close-btn { position: fixed; top: 30px; right: 30px; font-size: 40px; background: none; border: none; color: #fff; cursor: pointer; z-index: 1001; }
        .modal-header-large { font-size: 3rem; font-family: 'Oswald', sans-serif; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .modal-meta { display: flex; gap: 30px; color: var(--text-grey); font-size: 0.9rem; margin-bottom: 40px; }
        
        .modal-gallery img, .modal-gallery video { width: 100%; margin-bottom: 20px; display: block; }
        
        .yt-btn { display: inline-block; border: 1px solid #fff; color: #fff; padding: 15px 40px; text-decoration: none; font-family: 'Oswald', sans-serif; letter-spacing: 2px; transition: 0.3s; margin-top: 30px; margin-bottom: 50px; text-transform: uppercase; width: 100%; text-align: center; cursor: pointer; }
        .yt-btn:hover { background: #fff; color: #000; }
        .about-modal-layout { display: flex; gap: 40px; flex-wrap: wrap; }
        .about-modal-img { flex: 1; min-width: 300px; }
        .about-modal-img img { width: 100%; filter: grayscale(100%); }
        .about-modal-text { flex: 2; }

        /* --- 📱 手機版專屬優化 --- */
        @media (max-width: 768px) {
            nav { padding: 15px 20px; }
            .logo { font-size: 20px; }
            .menu a { margin-left: 15px; font-size: 12px; }
            .hero-title { font-size: 4rem; } 
            .hero-content { padding: 0 20px; }
            .filter-section { padding: 30px 20px; gap: 15px; }
            .filter-btn { font-size: 13px; padding: 5px 0; }
            .gallery-grid { grid-template-columns: 1fr; padding: 0 20px 50px 20px; }
            
            .info-overlay {
                opacity: 1; 
                transform: translateY(0);
                background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); 
                padding: 20px;
            }
            .media-layer img, .media-layer video { opacity: 0.85; }
            
            .footer-container { flex-direction: column; align-items: flex-start; gap: 40px; }
            .footer-right { align-items: flex-start; text-align: left; }
            footer { padding: 50px 20px; }
            .modal-container { margin: 60px auto; }
            .modal-header-large { font-size: 2rem; }
            .about-modal-layout { flex-direction: column; gap: 20px; }
            .about-modal-img { min-width: 100%; }
        }

        /* --- 圖片預先下載與 Loading 視覺特效 --- */
        .img-loading-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #1c1c1c; /* 作為暫時的 Placeholder 底色 */
            overflow: hidden;
        }

        /* [關鍵修復] 確保 Loading 容器在 Hero Slider 中保持原本的絕對定位，不被 relative 覆蓋 */
        .hero-slide.img-loading-container {
            position: absolute;
        }

        /* 圖片未載入前的模糊與隱藏狀態 */
        .img-loading-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0; /* 隱藏逐步下載過程 */
            filter: blur(20px);
            transform: scale(1.1);
            transition: opacity 0.8s ease-out, filter 0.8s ease-out, transform 0.8s ease-out;
            display: block;
        }

        /* 圖片 100% 載入完成後的清晰狀態 */
        .img-loading-container.loaded img {
            opacity: 1;
            filter: blur(0);
            transform: scale(1);
        }

        /* 半透明毛玻璃 (Frosted Glass) Loading 遮罩 */
        .blur-placeholder.frosted-glass {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.08); /* 避免純黑色，帶點微光 */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 2;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
        }

        /* 圖片載入完成，毛玻璃淡出消失 */
        .img-loading-container.loaded .blur-placeholder.frosted-glass {
            opacity: 0;
            visibility: hidden;
        }

        /* --- 針對原本各區塊的樣式兼容與覆蓋 --- */
        /* Gallery Hover 特殊處理 (延續原本的 0.7 透明度設定) */
        .project-card .img-loading-container.loaded img { opacity: 0.7; }
        @media (min-width: 769px) {
            .project-card:hover .img-loading-container.loaded img { opacity: 1 !important; }
        }

        /* Modal 彈窗內的圖片間距處理 */
        .modal-img-wrapper { margin-bottom: 20px; border-radius: 4px; }
        .modal-img-wrapper img { margin-bottom: 0 !important; }

        /* About 彈窗內的灰階濾鏡兼容 */
        .about-modal-img .img-loading-container.loaded img { filter: grayscale(100%) blur(0); }
    </style>
</head>

    const sliderContainer = document.getElementById('heroBgSlider');

    if (sliderContainer) {
        heroBackgrounds.forEach((bg, index) => {
            let element;
            if (bg.type === 'video') {
                element = document.createElement('video');
                element.src = bg.src;
                if(bg.poster) element.poster = bg.poster; 
                element.muted = true; element.loop = true; element.playsInline = true; element.autoplay = true; 
                element.play().catch(e => console.log("Autoplay blocked"));
                element.className = 'hero-slide';
                if (index === 0) element.classList.add('active');
                sliderContainer.appendChild(element);
            } else {
                const wrapper = document.createElement('div');
                wrapper.className = 'hero-slide img-loading-container';
                if (index === 0) wrapper.classList.add('active');

                const glass = document.createElement('div');
                glass.className = 'blur-placeholder frosted-glass';

                element = document.createElement('img');
                
                if (index === 0) {
                    element.setAttribute('fetchpriority', 'high');
                    element.loading = 'eager'; 
                } else {
                    // [關鍵修復]：Hero 圖片即使隱藏，也要確保能順暢下載
                    element.setAttribute('fetchpriority', 'low');
                    element.loading = 'eager'; 
                }
                
                element.onload = () => wrapper.classList.add('loaded');
                element.src = bg.src;

                wrapper.appendChild(glass);
                wrapper.appendChild(element);
                sliderContainer.appendChild(wrapper);
            }
        });

        setInterval(() => {
            const slides = document.querySelectorAll('.hero-slide');

                slides[currentSlideIndex].classList.remove('active');

    /* --- 3. Core Logic --- */
    const container = document.getElementById('galleryContainer');
    const modal = document.getElementById('projectModal');
    const modalBody = document.getElementById('modalBody');

    function getPriorityIndex(types, orderList) {
        const typeArr = Array.isArray(types) ? types : [types];
        let minIndex = 999;
        typeArr.forEach(t => {
            const idx = orderList.indexOf(t);
            if (idx !== -1 && idx < minIndex) minIndex = idx;
        });
        return minIndex;
    }

    function renderProjects(filterType) {
        container.innerHTML = ''; 
        
        const filteredData = filterType === 'all' 
            ? projects 
            : projects.filter(p => {
                if (Array.isArray(p.type)) { return p.type.includes(filterType); }
                return p.type === filterType;
            });
        
        filteredData.sort((a, b) => {
            const indexA = getPriorityIndex(a.type, categorySortOrder);
            const indexB = getPriorityIndex(b.type, categorySortOrder);
            if (indexA !== indexB) {
                return indexA - indexB;
            }
            return (a.order || 999) - (b.order || 999);
        });
        
        filteredData.forEach((project, index) => {
            const card = document.createElement('div'); card.className = 'project-card';
            card.onclick = () => openModal(project);

            // 判斷圖片優先順序
            let preloadAttrs = '';
            if (index < 4) { 
                // 【第二優先級】首屏可見範圍 (前 4 張專案)：優先下載
                preloadAttrs = 'fetchpriority="high" loading="eager"';
            } else { 
                // 【第三優先級】非首屏需滾動內容：延遲下載
                preloadAttrs = 'fetchpriority="low" loading="lazy"';
            }

            let mediaContent = '';
            if (project.videoFile) {
                const posterAttr = project.poster ? `poster="${project.poster}"` : '';
                
                if (project.videoFile.toLowerCase().includes('loop')) {
                    mediaContent = `<video src="${project.videoFile}" ${posterAttr} autoplay muted loop playsinline preload="metadata"></video>`;
                } 
                else {
                    mediaContent = `<video src="${project.videoFile}" ${posterAttr} muted loop playsinline preload="none"></video>`;
                }
            } else if (project.imageFile) {
                // 套用毛玻璃 Loading 結構與優先順序
                mediaContent = `
                    <div class="img-loading-container" style="height: 100%;">
                        <div class="blur-placeholder frosted-glass"></div>
                        <img src="${project.imageFile}" alt="${project.title}" ${preloadAttrs} onload="this.closest('.img-loading-container').classList.add('loaded')">
                    </div>
                `;
            }

            let typeLabel = '';
            if (Array.isArray(project.type)) { typeLabel = project.type.join(' / ').toUpperCase(); } 
            else { typeLabel = project.type.toUpperCase(); }

            card.innerHTML = `
                <div class="media-layer">${mediaContent}</div>
                <div class="info-overlay">
                    <span class="card-type">${typeLabel}</span>
                    <h3 class="card-title">${project.title}</h3>
                </div>
            `;

            const video = card.querySelector('video');
            if (video && !video.hasAttribute('autoplay')) { 
                card.addEventListener('mouseenter', () => { 
                    video.muted = false; 
                    if (video.preload === 'none') { video.preload = 'auto'; }
                    var p = video.play();
                    if(p !== undefined) { p.catch(e => { video.muted = true; video.play(); }); }
                });
                card.addEventListener('mouseleave', () => { 
                    video.pause(); video.load(); 
                });
            }

            container.appendChild(card);
        });
    }

    function openModal(project) {
        const contentHtml = project.images.map((file, index) => {
            if (file.toLowerCase().endsWith('.mp4')) {
                if (file.toLowerCase().includes('loop')) {
                    return `<video src="${file}" autoplay muted loop playsinline></video>`;
                } else {
                    return `<video src="${file}" controls playsinline loop preload="metadata"></video>`;
                }
            } else {
                // 彈窗內的第一張圖優先，其餘延遲載入
                const preloadAttrs = index === 0 ? 'fetchpriority="high" loading="eager"' : 'fetchpriority="low" loading="lazy"';
                return `
                    <div class="img-loading-container modal-img-wrapper">
                        <div class="blur-placeholder frosted-glass"></div>
                        <img src="${file}" ${preloadAttrs} onload="this.closest('.img-loading-container').classList.add('loaded')">
                    </div>
                `;
            }
        }).join('');

        let buttonHtml = '';
        if (project.youtubeLink && project.youtubeLink !== "" && project.youtubeLink !== "#") {
            buttonHtml = `<a href="${project.youtubeLink}" target="_blank" class="yt-btn">WATCH FULL VIDEO</a>`;
        }

        let typeLabel = '';
        if (Array.isArray(project.type)) { typeLabel = project.type.join(' / ').toUpperCase(); } 
        else { typeLabel = project.type.toUpperCase(); }

        // --- 🌟 新增：解析內文的 "## 小標題" 語法 ---
        let processedDescription = project.description || '';
        processedDescription = processedDescription.replace(/^##\s+(.+)$/gm, '<div class="modal-content-subtitle">$1</div>');
